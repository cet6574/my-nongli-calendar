name: Update calendar
on:
  schedule:
    - cron: "0 2 * * *"   # 每天 UTC 2点(新加坡时间10点)运行
  workflow_dispatch:       # 也允许手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python make_calendar.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add lunar_short.ics
          git commit -m "update calendar" || echo "no change"
          git push
